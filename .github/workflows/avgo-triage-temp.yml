name: AVGO triage validation

on:
  push:
    branches:
      - analysis/avgo-2026-09-18-stage0-ev

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Self-test
        run: python harness.py selftest
      - name: Stage 0 intake
        run: python harness.py intake AVGO
      - name: Validate financial pack
        run: python harness.py validate-pack AVGO
      - name: Refreeze corrected inputs
        run: python harness.py freeze AVGO --provider openai --model gpt-5.6-sol --reasoning-effort high
      - name: Prompt checks
        run: |
          python harness.py prompt AVGO AS > /tmp/AVGO_AS_prompt.md
          python harness.py prompt AVGO DI > /tmp/AVGO_DI_prompt.md
          python harness.py prompt AVGO FS > /tmp/AVGO_FS_prompt.md
      - name: Validate triage reports
        run: |
          python harness.py validate AVGO AS
          python harness.py validate AVGO DI
          python harness.py validate AVGO FS
      - name: Aggregate and digest
        run: |
          python harness.py aggregate AVGO
          python harness.py digest AVGO
          python harness.py plan AVGO > runs/AVGO/plan_after_triage.txt
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/AVGO
          if ! git diff --cached --quiet; then
            git commit -m "analysis(avgo): validate triage and refresh aggregate"
            git push
          fi
