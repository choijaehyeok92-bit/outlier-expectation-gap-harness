name: NVDA v3.1 policy replay

on:
  push:
    branches:
      - analysis/nvda-v31-2026-09-19

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/nvda-v31-2026-09-19
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Replay NVDA under v3.1
        shell: bash
        run: |
          set -euo pipefail
          python harness.py selftest
          python harness.py fork-run NVDA-V3-2026-09-19 NVDA-V31-2026-09-19 --carry-domain-reports
          python harness.py freeze NVDA-V31-2026-09-19 --provider openai --model gpt-5.6-sol --reasoning-effort high
          python harness.py aggregate NVDA-V31-2026-09-19
          python harness.py digest NVDA-V31-2026-09-19
          python harness.py research-plan NVDA-V31-2026-09-19
          python harness.py report NVDA-V31-2026-09-19
          python harness.py plan NVDA-V31-2026-09-19 | tee runs/NVDA-V31-2026-09-19/plan_v31.txt
      - name: Commit replay artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/NVDA-V31-2026-09-19
          git commit -m "analysis(nvda): replay under v3.1 policy" || exit 0
          git push
