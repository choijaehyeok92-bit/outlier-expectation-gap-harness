name: AVGO macro validation

on:
  push:
    branches:
      - analysis/avgo-2026-09-18-stage0-ev

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Prompt and validate MO
        run: |
          python harness.py prompt AVGO MO > /tmp/MO.md
          python harness.py validate AVGO MO
      - name: Refresh aggregate and plan
        run: |
          python harness.py aggregate AVGO
          python harness.py digest AVGO
          python harness.py plan AVGO > runs/AVGO/plan_after_macro.txt
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/AVGO
          if ! git diff --cached --quiet; then
            git commit -m "analysis(avgo): validate macro overlay and refresh plan"
            git push
          fi
