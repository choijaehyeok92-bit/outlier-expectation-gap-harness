name: PL EV run 2026-09-17

on:
  push:
    branches:
      - run/pl-2026-09-17-sol-ic
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute PL EV harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/execution.log) 2>&1
          python harness.py selftest
          python harness.py init PL --as-of 2026-09-17
          mkdir -p runs/PL/sources runs/PL/prompts
          cp .github/fixtures/PL/source_README.md runs/PL/sources/README.md
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runs/PL/company_context.json")
          j=json.loads(p.read_text())
          j.update({
              "ticker":"PL",
              "company_name":"Planet Labs PBC",
              "as_of_date":"2026-09-17",
              "currency":"USD",
              "current_price":16.99,
              "shares_diluted":359594052,
              "market_cap_usd":6181777333.11,
              "enterprise_value":5764614333.11,
              "net_cash_per_share":1.1465310036384453,
              "valuation_percentile_5y":None,
              "valuation_metric":"deterministic owner-FCF/share DCF",
              "known_sources":[
                  "FY2026 Form 10-K filed 2026-03-23",
                  "FY2027 Q1 Form 10-Q filed 2026-06-05",
                  "FY2027 Q2 Form 10-Q filed 2026-09-03",
                  "Form 8-K / Q2 earnings release furnished 2026-09-03",
                  "PL 2026-09-17 historical NYSE close"
              ],
              "special_questions":[
                  "Does PL qualify for Moonshot under the <=$20B market-cap gate?",
                  "Can sovereign satellite services and AI-ready data convert growth into durable owner FCF/share without excessive dilution?"
              ]
          })
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+"\n")
          PY
          python harness.py freeze PL --provider openai --model gpt-5.6-sol --reasoning-effort high
          python harness.py plan PL
          python harness.py prompt PL EV --out runs/PL/prompts/EV.md
          cp .github/fixtures/PL/EV.json runs/PL/reports/EV.json
          python harness.py validate PL EV
          cp .github/fixtures/PL/AS.json runs/PL/reports/AS.json
          python harness.py validate PL AS
          cp .github/fixtures/PL/DI.json runs/PL/reports/DI.json
          python harness.py validate PL DI
          cp .github/fixtures/PL/TQ.json runs/PL/reports/TQ.json
          python harness.py validate PL TQ
          cp .github/fixtures/PL/SL.json runs/PL/reports/SL.json
          python harness.py validate PL SL
          cp .github/fixtures/PL/CP.json runs/PL/reports/CP.json
          python harness.py validate PL CP
          cp .github/fixtures/PL/MT.json runs/PL/reports/MT.json
          python harness.py validate PL MT
          cp .github/fixtures/PL/RF.json runs/PL/reports/RF.json
          python harness.py validate PL RF
          cp .github/fixtures/PL/MA.json runs/PL/reports/MA.json
          python harness.py validate PL MA
          cp .github/fixtures/PL/FS.json runs/PL/reports/FS.json
          python harness.py validate PL FS
          cp .github/fixtures/PL/MO.json runs/PL/reports/MO.json
          python harness.py validate PL MO
          python harness.py cache-macro PL
          python harness.py digest PL
          cp .github/fixtures/PL/ED.json runs/PL/reports/ED.json
          python harness.py validate PL ED
          cp .github/fixtures/PL/RT.json runs/PL/reports/RT.json
          python harness.py validate PL RT
          python harness.py aggregate PL
          python harness.py digest PL
          cp .github/fixtures/PL/IC.json runs/PL/reports/IC.json
          python harness.py validate PL IC
          cp .github/fixtures/PL/one_page_investment_record.md runs/PL/one_page_investment_record.md
          python - <<'PY'
          import json
          from pathlib import Path
          run=Path("runs/PL")
          agg=json.loads((run/"aggregate.json").read_text())
          mo=json.loads((run/"reports/MO.json").read_text())
          ic=json.loads((run/"reports/IC.json").read_text())
          fv={
              "ticker":"PL",
              "as_of_date":"2026-09-17",
              "score_100":agg["score_100"],
              "classification":agg["classification"],
              "disruptive_innovation_score":agg["disruptive_innovation_score"],
              "turnaround_quality_score":agg.get("turnaround_quality_score"),
              "archetype":"moonshot",
              "secondary_archetypes":agg["archetype"].get("secondary",[]),
              "archetype_rationale":"IC retains the mechanical Moonshot classification because market cap, DI, SL, AS and FS meet the configured thresholds and the ex-valuation gate is above 65. The unresolved long-term dilution Hard Veto prevents buy approval despite archetype fit.",
              "hard_veto_status":agg["hard_veto_status"],
              "ic_state":"WATCH",
              "position_range":"0% while dilution veto is unresolved; if cleared, 1-3% Moonshot starter cap with 0.80x macro pacing",
              "domain_scores":agg["domain_scores"],
              "disputes":agg["disputes"],
              "falsifiers":ic["falsifiers"],
              "macro_pacing_multiplier":mo["risk_budget_multiplier"]
          }
          required=["ticker","as_of_date","score_100","classification","disruptive_innovation_score","archetype","hard_veto_status","ic_state","position_range","domain_scores","disputes","falsifiers"]
          assert not [k for k in required if k not in fv]
          assert fv["archetype"]=="moonshot"
          assert fv["hard_veto_status"]=="UNRESOLVED"
          assert fv["ic_state"]=="WATCH"
          (run/"final_verdict.json").write_text(json.dumps(fv,ensure_ascii=False,indent=2))
          print(json.dumps(fv,ensure_ascii=False,indent=2))
          PY
          python harness.py plan PL
          python harness.py digest PL
          python harness.py aggregate PL
          echo "===== FINAL AGGREGATE ====="
          cat runs/PL/aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: PL-harness-run-2026-09-17-sol-ic
          path: |
            runs/PL
            runs/_macro
            runlogs/execution.log
