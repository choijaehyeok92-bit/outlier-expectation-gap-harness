name: RBRK domain validation

on:
  push:
    branches:
      - analysis/rbrk-2026-09-18-stage0-ev

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Validate domain reports
        run: |
          for a in CP LG MA MT RF SL; do python harness.py validate RBRK "$a"; done
      - name: Refresh aggregate and planner
        run: |
          python harness.py aggregate RBRK
          python harness.py digest RBRK
          python harness.py plan RBRK > runs/RBRK/plan_after_domains.txt
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/RBRK
          if ! git diff --cached --quiet; then
            git commit -m "analysis(rbrk): validate domains and refresh planner"
            git push
          fi
