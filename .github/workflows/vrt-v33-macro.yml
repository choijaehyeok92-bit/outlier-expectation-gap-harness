name: VRT v3.3 macro

on:
  push:
    branches:
      - work/vrt-2026-09-18-v33
    paths:
      - ".github/workflows/vrt-v33-macro.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/vrt-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Execute VRT macro overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/vrt-macro.log) 2>&1

          python harness.py selftest
          python harness.py prompt VRT MO --out runs/VRT/MO_prompt.md
          cp ".harness_inputs/VRT/reports/MO.json" "runs/VRT/reports/MO.json"
          python harness.py validate VRT MO

          python harness.py aggregate VRT | tee runlogs/aggregate_after_macro.json
          python harness.py digest VRT
          python harness.py plan VRT | tee runlogs/plan_after_macro.txt

          echo "===== NEXT PLAN ====="
          cat runlogs/plan_after_macro.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/VRT
          if ! git diff --cached --quiet; then
            git commit -m "macro: complete VRT overlay"
            git push origin HEAD:work/vrt-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VRT-v33-macro
          path: |
            runs/VRT
            runlogs
