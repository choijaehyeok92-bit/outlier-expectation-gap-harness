name: RKLB v3.3 complete triage
# rerun after AS rubric normalization

on:
  push:
    branches:
      - work/rklb-2026-09-18-v33
    paths:
      - ".github/workflows/rklb-v33-triage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/rklb-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Execute RKLB remaining triage plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/rklb-triage.log) 2>&1

          python harness.py selftest
          python harness.py intake RKLB
          python harness.py validate-pack RKLB

          for AGENT in AS DI FS; do
            python harness.py prompt RKLB "$AGENT" --out "runs/RKLB/${AGENT}_prompt.md"
            cp ".harness_inputs/RKLB/reports/${AGENT}.json" "runs/RKLB/reports/${AGENT}.json"
            python harness.py validate RKLB "$AGENT"
          done

          python harness.py aggregate RKLB | tee runlogs/aggregate_after_triage.json
          python harness.py digest RKLB
          python harness.py plan RKLB | tee runlogs/plan_after_triage.txt

          echo "===== DIGEST ====="
          cat runs/RKLB/digest.md
          echo "===== NEXT PLAN ====="
          cat runlogs/plan_after_triage.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/RKLB
          if ! git diff --cached --quiet; then
            git commit -m "triage: complete RKLB AS DI FS"
            git push origin HEAD:work/rklb-2026-09-18-v33
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RKLB-v33-triage
          path: |
            runs/RKLB
            runlogs
