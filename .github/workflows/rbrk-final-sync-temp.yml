name: RBRK final sync

on:
  push:
    branches:
      - analysis/rbrk-2026-09-18-stage0-ev

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Validate IC and refresh final artifacts
        run: |
          python harness.py validate RBRK IC
          python harness.py aggregate RBRK
          python harness.py digest RBRK
          python harness.py report RBRK
          python harness.py plan RBRK > runs/RBRK/plan_final.txt
          grep -q '"stage": "complete"' runs/RBRK/plan_final.txt
      - name: Commit synchronized outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/RBRK
          if ! git diff --cached --quiet; then
            git commit -m "analysis(rbrk): sync final sizing language"
            git push
          fi
