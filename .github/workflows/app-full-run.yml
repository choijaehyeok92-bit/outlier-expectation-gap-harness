name: APP full run 2026-09-17

on:
  push:
    branches:
      - run/app-2026-09-17-sol-full
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute APP full harness through IC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/execution.log) 2>&1
          python harness.py selftest
          python harness.py init APP --as-of 2026-09-17
          mkdir -p runs/APP/sources runs/APP/prompts
          cp .github/fixtures/APP/source_README.md runs/APP/sources/README.md
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runs/APP/company_context.json")
          j=json.loads(p.read_text())
          j.update({
              "ticker":"APP",
              "company_name":"AppLovin Corporation",
              "as_of_date":"2026-09-17",
              "currency":"USD",
              "current_price":321.49,
              "shares_diluted":337875000,
              "market_cap_usd":107586949990.0,
              "enterprise_value":108048715990.0,
              "net_cash_per_share":-1.3798434787285858,
              "valuation_percentile_5y":None,
              "valuation_metric":"deterministic owner-FCF/share DCF",
              "known_sources":[
                  "FY2025 Form 10-K filed 2026-02-19",
                  "FY2026 Q1 Form 10-Q filed 2026-05-06",
                  "FY2026 Q2 Form 10-Q filed 2026-08-05",
                  "Form 8-K / Q2 earnings release filed 2026-08-05",
                  "APP 2026-09-17 Nasdaq historical close"
              ],
              "special_questions":[
                  "Moonshot market-cap gate is expected to fail; which non-Moonshot archetype remains reachable?",
                  "Can Axon AI sustain high FCF/share compounding as margins normalize and competition/platform regulation evolves?"
              ]
          })
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+"\n")
          PY
          python harness.py freeze APP --provider openai --model gpt-5.6-sol --reasoning-effort high
          python harness.py plan APP
          python harness.py prompt APP EV --out runs/APP/prompts/EV.md
          cp .github/fixtures/APP/EV.json runs/APP/reports/EV.json
          python harness.py validate APP EV
          cp .github/fixtures/APP/AS.json runs/APP/reports/AS.json
          python harness.py validate APP AS
          cp .github/fixtures/APP/DI.json runs/APP/reports/DI.json
          python harness.py validate APP DI
          cp .github/fixtures/APP/TQ.json runs/APP/reports/TQ.json
          python harness.py validate APP TQ
          cp .github/fixtures/APP/SL.json runs/APP/reports/SL.json
          python harness.py validate APP SL
          cp .github/fixtures/APP/CP.json runs/APP/reports/CP.json
          python harness.py validate APP CP
          cp .github/fixtures/APP/MT.json runs/APP/reports/MT.json
          python harness.py validate APP MT
          cp .github/fixtures/APP/RF.json runs/APP/reports/RF.json
          python harness.py validate APP RF
          cp .github/fixtures/APP/MA.json runs/APP/reports/MA.json
          python harness.py validate APP MA
          cp .github/fixtures/APP/FS.json runs/APP/reports/FS.json
          python harness.py validate APP FS
          cp .github/fixtures/APP/MO.json runs/APP/reports/MO.json
          python harness.py validate APP MO
          python harness.py cache-macro APP
          python harness.py digest APP
          cp .github/fixtures/APP/ED.json runs/APP/reports/ED.json
          python harness.py validate APP ED
          cp .github/fixtures/APP/RT.json runs/APP/reports/RT.json
          python harness.py validate APP RT
          python harness.py aggregate APP
          python harness.py digest APP
          cp .github/fixtures/APP/IC.json runs/APP/reports/IC.json
          python harness.py validate APP IC
          cp .github/fixtures/APP/one_page_investment_record.md runs/APP/one_page_investment_record.md
          python - <<'PY'
          import json
          from pathlib import Path
          run=Path("runs/APP")
          agg=json.loads((run/"aggregate.json").read_text())
          mo=json.loads((run/"reports/MO.json").read_text())
          ic=json.loads((run/"reports/IC.json").read_text())
          fv={
              "ticker":"APP",
              "as_of_date":"2026-09-17",
              "score_100":agg["score_100"],
              "classification":agg["classification"],
              "disruptive_innovation_score":agg["disruptive_innovation_score"],
              "turnaround_quality_score":agg.get("turnaround_quality_score"),
              "archetype":"compounder",
              "secondary_archetypes":agg["archetype"].get("secondary",[]),
              "archetype_rationale":"IC retains the mechanical Compounder classification. APP meets MT/RF/MA/FS/EV thresholds and all Hard Vetoes are cleared. DI is high, but frozen market cap is about $107.6B, so it is ineligible for Moonshot under the <=$20B rule.",
              "hard_veto_status":agg["hard_veto_status"],
              "ic_state":"NORMAL_CANDIDATE",
              "position_range":"2-4% strategic range; initial 2-3% deployment with 0.85x macro pacing",
              "domain_scores":agg["domain_scores"],
              "disputes":agg["disputes"],
              "falsifiers":ic["falsifiers"],
              "macro_pacing_multiplier":mo["risk_budget_multiplier"]
          }
          required=["ticker","as_of_date","score_100","classification","disruptive_innovation_score","archetype","hard_veto_status","ic_state","position_range","domain_scores","disputes","falsifiers"]
          assert not [k for k in required if k not in fv]
          assert fv["archetype"]=="compounder"
          assert fv["hard_veto_status"]=="CLEARED"
          assert fv["ic_state"]=="NORMAL_CANDIDATE"
          (run/"final_verdict.json").write_text(json.dumps(fv,ensure_ascii=False,indent=2))
          print(json.dumps(fv,ensure_ascii=False,indent=2))
          PY
          python harness.py plan APP
          python harness.py digest APP
          python harness.py aggregate APP
          cat runs/APP/aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: APP-harness-IC-2026-09-17
          path: |
            runs/APP
            runs/_macro
            runlogs/execution.log
