name: META validate freeze and EV prompt 2026-09-18

on:
  push:
    branches:
      - work/meta-2026-09-18-v33
    paths:
      - ".github/workflows/meta-v33-freeze.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/meta-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate Stage 0, freeze, plan, and emit EV prompt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/meta-freeze.log) 2>&1
          python harness.py validate-pack META | tee runlogs/validate-pack.txt
          set +e
          python harness.py intake META | tee runlogs/intake-after-pack.txt
          INTAKE_RC=${PIPESTATUS[0]}
          set -e
          echo "intake_exit_code=$INTAKE_RC" | tee runlogs/intake-after-pack-status.txt
          python harness.py freeze META --provider openai --model gpt-5.6-sol --reasoning-effort high | tee runlogs/freeze.txt
          python harness.py plan META | tee runlogs/plan.txt
          python harness.py prompt META EV --out runs/META/EV_prompt.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/META runlogs
          if ! git diff --cached --quiet; then
            git commit -m "run: validate and freeze META 2026-09-18"
            git push origin HEAD:work/meta-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: META-freeze-2026-09-18
          path: |
            runs/META
            runlogs
