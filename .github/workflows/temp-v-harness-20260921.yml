name: Temporary V harness execution 2026-09-21

on:
  push:
    branches:
      - automation/v-harness-20260921
    paths:
      - ".github/workflows/temp-v-harness-20260921.yml"
      - "scripts/temp_run_v_20260921.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/v-harness-20260921
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install -r requirements.txt
          fi

      - name: Execute harness
        continue-on-error: true
        run: bash scripts/temp_run_v_20260921.sh

      - name: Persist execution outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/V runlogs
          if ! git diff --cached --quiet; then
            git commit -m "automation: persist requested V harness execution"
            git push origin HEAD:automation/v-harness-20260921
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V-requested-harness-execution-20260921
          path: |
            runs/V
            runlogs
