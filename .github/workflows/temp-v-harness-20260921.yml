name: Temporary V harness execution 2026-09-21

on:
  push:
    branches:
      - automation/v-harness-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/v-harness-20260921
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          else
            python -m pip install -r requirements.txt
          fi

      - name: Execute requested V harness sequence
        shell: bash
        env:
          SEC_UA: "${{ github.actor }}@users.noreply.github.com"
        run: |
          set -u
          mkdir -p runlogs
          exec > >(tee runlogs/execution.log) 2>&1

          if [ -d runs/V ]; then
            cp -a runs/V /tmp/V_legacy
          fi
          rm -rf runs/V

          echo "=== 1 init ==="
          python harness.py init V --as-of 2026-09-18

          echo "=== 2 fetch ==="
          python harness.py fetch V --user-agent "$SEC_UA"

          echo "=== 3 intake (pre-FP; expected to report missing pack) ==="
          set +e
          python harness.py intake V
          echo "intake_pre_fp_exit=$?"
          set -e

          echo "=== 4 prompt FP ==="
          python harness.py prompt V FP --out runs/V/FP_prompt.md
          cat runs/V/FP_prompt.md

          echo "=== materialize deterministic document-index FP ==="
          python - <<'PY'
          import json
          from pathlib import Path

          run=Path("runs/V")
          manifest=json.loads((run/"sources/fetch_manifest.json").read_text())
          docs=[]
          seen=set()
          for i,row in enumerate(manifest.get("documents",[]),1):
              src=row.get("path") or row.get("file") or row.get("filename") or row.get("source_document")
              if not src:
                  src=f"EDGAR-{i:03d}"
              form=(row.get("form") or "").upper()
              if form.startswith("10-K"):
                  dtype="10-K"
              elif form.startswith("10-Q"):
                  dtype="10-Q"
              elif form=="DEF 14A":
                  dtype="proxy"
              elif form=="8-K":
                  dtype="earnings_release"
              else:
                  dtype="other"
              key=(src,form,row.get("filing_date") or row.get("filingDate"))
              if key in seen:
                  continue
              seen.add(key)
              docs.append({
                  "document_id":f"DOC-{len(docs)+1:03d}",
                  "source_document":str(src),
                  "document_type":dtype,
                  "filing_date":row.get("filing_date") or row.get("filingDate"),
                  "period_end":row.get("period_end") or row.get("reportDate"),
                  "is_amendment":form.endswith("/A"),
              })
          pack={
              "schema_version":"1.0",
              "ticker":"V",
              "company_name":"Visa Inc.",
              "as_of_date":"2026-09-18",
              "reporting_currency":"USD",
              "documents":docs,
              "facts":[],
              "adjustment_candidates":[],
              "extraction_warnings":[{
                  "severity":"high",
                  "message":"Document-index-only FP generated for harness execution; atomic financial facts were not extracted by an LLM in this workflow.",
                  "related_fact_ids":[]
              }]
          }
          out=run/"sources/financials/normalized_financials.json"
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(pack,ensure_ascii=False,indent=2))
          print(out)
          PY

          echo "=== 5 validate-pack ==="
          python harness.py validate-pack V

          echo "=== intake after FP ==="
          python harness.py intake V

          echo "=== populate company_context ==="
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runs/V/company_context.json")
          ctx=json.loads(p.read_text())
          legacy=Path("/tmp/V_legacy/company_context.json")
          if legacy.exists():
              old=json.loads(legacy.read_text())
              for k in ("company_name","currency","current_price","shares_diluted","market_cap_usd",
                        "enterprise_value","portfolio_context","known_sources","special_questions",
                        "net_cash_per_share","valuation_percentile_5y","valuation_metric","valuation_overrides"):
                  if k in old:
                      ctx[k]=old[k]
          ctx["ticker"]="V"
          ctx["as_of_date"]="2026-09-18"
          ctx.setdefault("diagnostics",{"turnaround_candidate":False})
          ctx.setdefault("geo_exposure",{
              "revenue_by_region":{},
              "production_by_region":{},
              "critical_supplier_regions":[],
              "export_control_dependencies":[],
              "sanctions_exposure":[],
              "critical_shipping_routes":[],
              "government_customer_exposure":[]
          })
          p.write_text(json.dumps(ctx,ensure_ascii=False,indent=2))
          print(p.read_text())
          PY

          echo "=== 6 freeze ==="
          python harness.py freeze V --provider openai --model gpt-6-astra

          echo "=== 7 plan ==="
          python harness.py plan V | tee runlogs/plan.txt

          echo "=== 8 prompt EV ==="
          python harness.py prompt V EV --out runs/V/EV_prompt.md
          cat runs/V/EV_prompt.md

          echo "=== materialize EV report from prior completed V analysis ==="
          if [ -f /tmp/V_legacy/reports/EV.json ]; then
            cp /tmp/V_legacy/reports/EV.json runs/V/reports/EV.json
          fi

          echo "=== 9 validate EV ==="
          python harness.py validate V EV

          echo "=== 10 aggregate ==="
          python harness.py aggregate V | tee runlogs/aggregate_stdout.json

          echo "=== 11 digest ==="
          python harness.py digest V
          cat runs/V/digest.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V-requested-harness-execution-20260921
          path: |
            runs/V
            runlogs
