name: MSFT EV run 2026-09-18

on:
  push:
    branches:
      - run/msft-2026-09-18-sol-ev

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute MSFT EV harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/execution.log) 2>&1
          python harness.py selftest
          python harness.py init MSFT --as-of 2026-09-18
          echo '' | base64 -d > runs/MSFT/company_context.json
          mkdir -p runs/MSFT/sources
          echo '' | base64 -d > runs/MSFT/sources/README.md
          python harness.py freeze MSFT --provider openai --model gpt-5.6-sol --reasoning-effort high
          python harness.py plan MSFT
          python harness.py prompt MSFT EV --out runs/MSFT/EV_prompt.md
          echo '' | base64 -d > runs/MSFT/reports/EV.json
          python harness.py validate MSFT EV
          python harness.py digest MSFT
          python harness.py aggregate MSFT
          echo "===== FINAL AGGREGATE ====="
          cat runs/MSFT/aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: MSFT-harness-run-2026-09-18-sol-ev
          path: |
            runs/MSFT
            runlogs/execution.log
