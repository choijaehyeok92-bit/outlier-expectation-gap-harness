name: ALAB v3.3 complete triage

on:
  push:
    branches:
      - work/alab-2026-09-18-v33
    paths:
      - ".github/workflows/alab-v33-triage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/alab-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt

      - name: Execute ALAB remaining triage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/alab-triage.log) 2>&1

          python harness.py selftest
          python harness.py intake ALAB
          python harness.py validate-pack ALAB

          for AGENT in AS DI FS; do
            python harness.py prompt ALAB "$AGENT" --out "runs/ALAB/${AGENT}_prompt.md"
            cp ".harness_inputs/ALAB/reports/${AGENT}.json" "runs/ALAB/reports/${AGENT}.json"
            python harness.py validate ALAB "$AGENT"
          done

          python harness.py aggregate ALAB | tee runlogs/aggregate_after_triage.json
          python harness.py digest ALAB
          python harness.py plan ALAB | tee runlogs/plan_after_triage.txt

          echo "===== DIGEST ====="
          cat runs/ALAB/digest.md
          echo "===== NEXT PLAN ====="
          cat runlogs/plan_after_triage.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/ALAB
          if ! git diff --cached --quiet; then
            git commit -m "triage: complete ALAB AS DI FS"
            git push origin HEAD:work/alab-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ALAB-v33-triage
          path: |
            runs/ALAB
            runlogs
