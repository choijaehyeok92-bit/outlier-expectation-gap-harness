name: RBRK stage0 fetch

on:
  push:
    branches:
      - analysis/rbrk-2026-09-18-stage0-ev

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Init and fetch
        run: |
          python harness.py init RBRK --as-of 2026-09-18
          python harness.py fetch RBRK --user-agent "choijaehyeok92@gmail.com"
          python harness.py intake RBRK || true
          python harness.py prompt RBRK FP > runs/RBRK/fp_prompt.md
      - name: Commit run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/RBRK
          git commit -m "analysis(rbrk): init and fetch EDGAR stage0"
          git push
