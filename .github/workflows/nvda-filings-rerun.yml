name: NVDA filing-first rerun 2026-09-18

on:
  push:
    branches:
      - run/nvda-2026-09-18-filings-rerun

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute filing-first harness rerun
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/execution.log) 2>&1
          python harness.py selftest
          python harness.py init NVDA --as-of 2026-09-18
          echo '' | base64 -d > runs/NVDA/company_context.json
          mkdir -p runs/NVDA/sources
          echo '' | base64 -d > runs/NVDA/sources/README.md
          python harness.py freeze NVDA --provider openai --model gpt-5.6-sol --reasoning-effort high
          python harness.py plan NVDA
          python harness.py prompt NVDA EV --out runs/NVDA/EV_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/EV.json
          python harness.py validate NVDA EV
          python harness.py prompt NVDA AS --out runs/NVDA/AS_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/AS.json
          python harness.py validate NVDA AS
          python harness.py prompt NVDA DI --out runs/NVDA/DI_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/DI.json
          python harness.py validate NVDA DI
          python harness.py plan NVDA
          python harness.py prompt NVDA SL --out runs/NVDA/SL_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/SL.json
          python harness.py validate NVDA SL
          python harness.py prompt NVDA CP --out runs/NVDA/CP_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/CP.json
          python harness.py validate NVDA CP
          python harness.py prompt NVDA MT --out runs/NVDA/MT_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/MT.json
          python harness.py validate NVDA MT
          python harness.py prompt NVDA RF --out runs/NVDA/RF_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/RF.json
          python harness.py validate NVDA RF
          python harness.py prompt NVDA MA --out runs/NVDA/MA_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/MA.json
          python harness.py validate NVDA MA
          python harness.py prompt NVDA FS --out runs/NVDA/FS_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/FS.json
          python harness.py validate NVDA FS
          python harness.py plan NVDA
          python harness.py prompt NVDA MO --out runs/NVDA/MO_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/MO.json
          python harness.py validate NVDA MO
          python harness.py cache-macro NVDA
          python harness.py plan NVDA
          python harness.py digest NVDA
          python harness.py prompt NVDA ED --out runs/NVDA/ED_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/ED.json
          python harness.py validate NVDA ED
          python harness.py prompt NVDA RT --out runs/NVDA/RT_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/RT.json
          python harness.py validate NVDA RT
          python harness.py plan NVDA
          python harness.py digest NVDA
          python harness.py aggregate NVDA
          python harness.py prompt NVDA IC --out runs/NVDA/IC_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/IC.json
          python harness.py validate NVDA IC
          python harness.py plan NVDA
          python harness.py aggregate NVDA
          python - <<'PY'
          from pathlib import Path
          import json
          run=Path("runs/NVDA")
          agg=json.loads((run/"aggregate.json").read_text(encoding="utf-8"))
          verdict={
            "ticker":"NVDA","as_of_date":"2026-09-18","score_100":agg["score_100"],
            "classification":agg["classification"],"disruptive_innovation_score":agg["disruptive_innovation_score"],
            "archetype":"compounder","secondary_archetypes":[],
            "archetype_rationale":"Filing-first rerun retains compounder. AS 63.5 prevents emerging-outlier/moonshot classification.",
            "hard_veto_status":agg["hard_veto_status"],"ic_state":"NORMAL_CANDIDATE",
            "position_range":"2-4% target; initial 1.5-2%, staged at 0.9x macro pacing",
            "domain_scores":agg["domain_scores"],"disputes":agg["disputes"],
            "falsifiers":[
              "FCF conversion weakens while AR/commitments/guarantees keep rising.",
              "Custom silicon materially erodes platform economics.",
              "Owner FCF/share misses the revised Base path for two fiscal years."
            ],
            "macro_pacing_multiplier":0.9
          }
          (run/"final_verdict.json").write_text(json.dumps(verdict,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          echo '' | base64 -d > runs/NVDA/one_page_investment_record.md
          python harness.py digest NVDA
          echo "===== FINAL AGGREGATE ====="
          cat runs/NVDA/aggregate.json
          echo "===== FINAL VERDICT ====="
          cat runs/NVDA/final_verdict.json
          echo "===== DIGEST ====="
          cat runs/NVDA/digest.md

      - uses: actions/upload-artifact@v4
        with:
          name: NVDA-harness-filing-first-rerun-2026-09-18
          path: |
            runs/NVDA
            runlogs/execution.log
