name: VRT v3.3 triage

on:
  push:
    branches:
      - work/vrt-2026-09-18-v33
    paths:
      - ".github/workflows/vrt-v33-triage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/vrt-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Execute VRT triage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/vrt-triage.log) 2>&1

          python harness.py selftest
          for AGENT in EV AS DI FS; do
            python harness.py prompt VRT "$AGENT" --out "runs/VRT/${AGENT}_prompt.md"
            cp ".harness_inputs/VRT/reports/${AGENT}.json" "runs/VRT/reports/${AGENT}.json"
            python harness.py validate VRT "$AGENT"
          done

          python harness.py aggregate VRT | tee runlogs/aggregate_after_triage.json
          python harness.py digest VRT
          python harness.py plan VRT | tee runlogs/plan_after_triage.txt

          echo "===== NEXT PLAN ====="
          cat runlogs/plan_after_triage.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/VRT
          if ! git diff --cached --quiet; then
            git commit -m "triage: complete VRT EV AS DI FS"
            git push origin HEAD:work/vrt-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VRT-v33-triage
          path: |
            runs/VRT
            runlogs
