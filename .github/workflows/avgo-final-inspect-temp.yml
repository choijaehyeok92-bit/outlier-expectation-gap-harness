name: AVGO final inspect

on:
  push:
    branches:
      - analysis/avgo-2026-09-18-stage0-ev

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Final validation and outputs
        run: |
          python harness.py selftest
          for a in SL CP MT RF MA FS EV AS DI ED RT MO IC; do python harness.py validate AVGO "$a"; done
          python harness.py aggregate AVGO >/tmp/aggregate_stdout.txt
          python harness.py report AVGO >/tmp/report_stdout.txt
          echo '===PLAN_FINAL_BEGIN==='
          python harness.py plan AVGO
          echo '===PLAN_FINAL_END==='
          echo '===EASY_REPORT_BEGIN==='
          cat runs/AVGO/easy_report.md
          echo '===EASY_REPORT_END==='
