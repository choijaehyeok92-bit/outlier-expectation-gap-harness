name: MSFT GPT-5.6 Sol harness run 2026-09-17

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Replay historical MSFT inputs without overwriting the archived run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          import contextlib, hashlib, io, json, shutil
          import jsonschema
          from harness_core import runtime as h
          source = Path("runs/MSFT")
          before = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in source.rglob("*") if p.is_file()}
          ticker = "MSFT-CI-REPLAY"
          h.cmd_init(SimpleNamespace(ticker=ticker, as_of="2026-09-17"))
          run = h.run_dir(ticker)
          shutil.copy2(source/"manual_inputs/company_context.json", run/"company_context.json")
          shutil.copytree(source/"manual_sources", run/"sources", dirs_exist_ok=True)
          # Reuse only the archived domain assessments; current stages determine remaining work.
          for agent in h.MANIFEST:
              path = source/"manual_reports"/f"{agent['agent_id']}.json"
              if agent['role'] == 'domain_analyst' and agent['agent_id'] != 'TQ' and path.exists():
                  report = h.load_json(path)
                  assert not h.validate_report(report), agent['agent_id']
                  shutil.copy2(path, run/"reports"/path.name)
          h.cmd_freeze(SimpleNamespace(ticker=ticker, provider="openai", model="gpt-5.6-sol", reasoning_effort="high"))
          with contextlib.redirect_stdout(io.StringIO()):
              h.cmd_aggregate(SimpleNamespace(ticker=ticker))
              h.cmd_digest(SimpleNamespace(ticker=ticker, thesis_chars=160, unknowns=2))
          h.cmd_research_plan(SimpleNamespace(ticker=ticker))
          h.cmd_report(SimpleNamespace(ticker=ticker))
          verdict = h.load_json(run/"final_verdict.json")
          jsonschema.validate(verdict, h.load_json(Path("schemas/final_verdict.schema.json")))
          assert verdict["ic_verdict"] is None, "Historical IC must not silently approve a new policy run"
          assert "아직 투자위원회 최종 결론이 아닙니다" in (run/"easy_report.md").read_text(encoding="utf-8")
          after = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in source.rglob("*") if p.is_file()}
          assert before == after, "Historical artifacts changed"
          print(json.dumps(h.plan(ticker, h.load_reports(ticker)), ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msft-policy-replay
          path: runs/MSFT-CI-REPLAY/
