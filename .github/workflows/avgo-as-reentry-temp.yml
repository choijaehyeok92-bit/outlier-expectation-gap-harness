name: AVGO AS reentry research ingest

on:
  push:
    branches:
      - analysis/avgo-2026-09-18-stage0-ev

permissions:
  contents: write

jobs:
  ingest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Ingest research packet
        run: python harness.py research-ingest AVGO runs/AVGO/research/packet_as_reentry.json
      - name: Commit content-addressed research result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/AVGO/research
          if ! git diff --cached --quiet; then
            git commit -m "analysis(avgo): ingest AS reentry research"
            git push
          fi
