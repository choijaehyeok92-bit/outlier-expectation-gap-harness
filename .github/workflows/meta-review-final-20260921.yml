name: META review final validate 2026-09-21

on:
  push:
    branches:
      - work/meta-2026-09-21-v33
    paths:
      - ".github/workflows/meta-review-final-20260921.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/meta-2026-09-21-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate IC and finalize review-only run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/meta-review-final.log) 2>&1
          python harness.py validate META_REVIEW_20260921 IC
          python harness.py validate META_REVIEW_20260921
          python harness.py aggregate META_REVIEW_20260921 | tee runlogs/meta-review-aggregate-final.json
          python harness.py digest META_REVIEW_20260921
          python harness.py plan META_REVIEW_20260921 | tee runlogs/meta-review-plan-final.txt
          python harness.py report META_REVIEW_20260921
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/META_REVIEW_20260921 runlogs
          if ! git diff --cached --quiet; then
            git commit -m "review: finalize META analysis 2026-09-21"
            git push origin HEAD:work/meta-2026-09-21-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: META-review-complete-2026-09-21
          path: |
            runs/META_REVIEW_20260921
            runlogs/meta-review-*
