name: VRT v3.3 stage0 validate freeze

on:
  push:
    branches:
      - work/vrt-2026-09-18-v33
    paths:
      - ".github/workflows/vrt-v33-freeze.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/vrt-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate pack and freeze VRT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/vrt-freeze.log) 2>&1

          python harness.py selftest
          python harness.py intake VRT | tee runlogs/intake_after_fp.txt
          python harness.py validate-pack VRT
          python harness.py freeze VRT --provider openai --model GPT-5.6-Sol
          python harness.py plan VRT | tee runlogs/plan_after_freeze.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/VRT
          if ! git diff --cached --quiet; then
            git commit -m "stage0: validate and freeze VRT"
            git push origin HEAD:work/vrt-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VRT-v33-freeze
          path: |
            runs/VRT
            runlogs
