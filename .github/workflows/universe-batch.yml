name: Universe batch

# Manual only: a universe batch is an explicit operator decision, never a side effect of a push.
on:
  workflow_dispatch:
    inputs:
      tickers_file:
        description: "Ticker list in the repo (TXT/CSV/JSON), e.g. examples/universe_example.csv"
        required: true
      as_of:
        description: "Analysis cutoff YYYY-MM-DD"
        required: true
      mode:
        description: "triage-only | eligible-only | full"
        required: true
        default: triage-only
      workers:
        description: "Parallel tickers"
        required: false
        default: "2"
      context_csv:
        description: "Optional CSV of operator-supplied closes (universe context --template format)"
        required: false
        default: ""
      agent_cmd:
        description: "Optional model command template, e.g. python scripts/agent_cmd.py --prompt {prompt} --output {output} -- claude -p"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Run universe batch
        shell: bash
        env:
          TICKERS_FILE: ${{ inputs.tickers_file }}
          AS_OF: ${{ inputs.as_of }}
          MODE: ${{ inputs.mode }}
          WORKERS: ${{ inputs.workers }}
          # Stage 0 EDGAR fetch needs a contact; set the repository secret SEC_USER_AGENT ("Name email").
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # KRX Stage 0 (OpenDART). Never echoed; the harness strips it from every URL it records.
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          # Only needed when agent_cmd calls a hosted model.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTEXT_CSV: ${{ inputs.context_csv }}
          AGENT_CMD: ${{ inputs.agent_cmd }}
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/universe-batch.log) 2>&1
          python harness.py selftest
          python harness.py universe import "$TICKERS_FILE" --as-of "$AS_OF"
          if [ -n "$CONTEXT_CSV" ]; then python harness.py universe context "$CONTEXT_CSV" || true; fi
          python harness.py universe run --dry-run
          EXTRA=()
          if [ -n "$AGENT_CMD" ]; then EXTRA+=(--agent-cmd "$AGENT_CMD"); fi
          case "$MODE" in
            triage-only)   python harness.py universe run --triage-only --workers "$WORKERS" "${EXTRA[@]}" ;;
            eligible-only) python harness.py universe continue --eligible-only --workers "$WORKERS" "${EXTRA[@]}" ;;
            full)          python harness.py universe run --workers "$WORKERS" "${EXTRA[@]}" ;;
            *) echo "unknown mode $MODE"; exit 2 ;;
          esac
          python harness.py universe report
          python harness.py universe status
          python harness.py universe validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs universe reports/universe runlogs
          if ! git diff --cached --quiet; then
            git commit -m "universe: $MODE batch as of $AS_OF"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-${{ inputs.as_of }}
          path: |
            universe
            reports/universe
            runlogs
