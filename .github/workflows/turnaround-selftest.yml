name: Turnaround feature selftest

on:
  push:
    branches:
      - feature/turnaround-archetype-2026-09-18

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run harness selftest
        run: |
          set -euo pipefail
          python harness.py selftest
          python harness.py init TEST --as-of 2026-09-18
          python - <<'PY'
          import json
          from pathlib import Path
          run=Path("runs/TEST")
          tq=json.loads((run/"reports/TQ.json").read_text())
          assert tq["domain"]=="turnaround_quality"
          assert [x["criterion_id"] for x in tq["subscores"]]==[
            "operating_inflection","self_help_quality","normalized_earnings_bridge","catalyst_accountability"
          ]
          strategy=json.loads(Path("config/strategy.json").read_text())
          ta=next(x for x in strategy["archetypes"]["types"] if x["id"]=="turnaround")
          assert ta["min_gate_score"]==55
          assert ta["position_cap"].startswith("1-3%")
          print("turnaround init/config selftest: OK")
          PY
