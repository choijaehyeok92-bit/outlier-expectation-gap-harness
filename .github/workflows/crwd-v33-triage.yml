name: CRWD v3.3 triage

on:
  push:
    branches:
      - work/crwd-2026-09-18-v33
    paths:
      - ".github/workflows/crwd-v33-triage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crwd-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Execute CRWD triage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/crwd-triage.log) 2>&1

          python harness.py selftest
          for AGENT in EV AS DI FS; do
            python harness.py prompt CRWD "$AGENT" --out "runs/CRWD/${AGENT}_prompt.md"
            cp ".harness_inputs/CRWD/reports/${AGENT}.json" "runs/CRWD/reports/${AGENT}.json"
            python harness.py validate CRWD "$AGENT"
          done

          python harness.py aggregate CRWD | tee runlogs/aggregate_after_triage.json
          python harness.py digest CRWD
          python harness.py plan CRWD | tee runlogs/plan_after_triage.txt

          echo "===== NEXT PLAN ====="
          cat runlogs/plan_after_triage.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/CRWD
          if ! git diff --cached --quiet; then
            git commit -m "triage: complete CRWD EV AS DI FS"
            git push origin HEAD:work/crwd-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CRWD-v33-triage
          path: |
            runs/CRWD
            runlogs
