name: CRWD v3.3 stage0 validate freeze

on:
  push:
    branches:
      - work/crwd-2026-09-18-v33
    paths:
      - ".github/workflows/crwd-v33-freeze.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crwd-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate pack and freeze CRWD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/crwd-freeze.log) 2>&1

          python harness.py selftest
          python harness.py intake CRWD | tee runlogs/intake_after_fp.txt
          python harness.py validate-pack CRWD
          python harness.py freeze CRWD --provider openai --model GPT-5.6-Sol
          python harness.py plan CRWD | tee runlogs/plan_after_freeze.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/CRWD
          if ! git diff --cached --quiet; then
            git commit -m "stage0: validate and freeze CRWD"
            git push origin HEAD:work/crwd-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CRWD-v33-freeze
          path: |
            runs/CRWD
            runlogs
