name: AVGO final validation

on:
  push:
    branches:
      - analysis/avgo-2026-09-18-stage0-ev

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Self-test
        run: python harness.py selftest
      - name: Validate completed reports
        run: |
          for a in SL CP MT RF MA FS EV AS DI ED RT MO IC; do python harness.py validate AVGO "$a"; done
      - name: Final aggregate and reports
        run: |
          python harness.py aggregate AVGO
          python harness.py digest AVGO
          python harness.py report AVGO
          python harness.py plan AVGO > runs/AVGO/plan_final.txt
          grep -q '"stage": "complete"' runs/AVGO/plan_final.txt
      - name: Commit final artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/AVGO
          if ! git diff --cached --quiet; then
            git commit -m "analysis(avgo): finalize v3.1 run"
            git push
          fi
