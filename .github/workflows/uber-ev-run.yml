name: UBER EV run 2026-09-18

on:
  push:
    branches:
      - run/uber-2026-09-18-sol-ev

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute UBER EV harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/execution.log) 2>&1
          python harness.py selftest
          python harness.py init UBER --as-of 2026-09-18
          echo '' | base64 -d > runs/UBER/company_context.json
          mkdir -p runs/UBER/sources
          echo '' | base64 -d > runs/UBER/sources/README.md
          python harness.py freeze UBER --provider openai --model gpt-5.6-sol --reasoning-effort high
          python harness.py plan UBER
          python harness.py prompt UBER EV --out runs/UBER/EV_prompt.md
          echo '' | base64 -d > runs/UBER/reports/EV.json
          python harness.py validate UBER EV
          python harness.py digest UBER
          python harness.py aggregate UBER
          echo "===== FINAL AGGREGATE ====="
          cat runs/UBER/aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: UBER-harness-run-2026-09-18-sol-ev
          path: |
            runs/UBER
            runlogs/execution.log
