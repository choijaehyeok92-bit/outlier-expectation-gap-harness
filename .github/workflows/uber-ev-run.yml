name: UBER IC run 2026-09-18

on:
  push:
    branches:
      - run/uber-2026-09-18-sol-ev

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute UBER IC harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/execution.log) 2>&1
          python harness.py selftest
          python harness.py init UBER --as-of 2026-09-18
          echo '' | base64 -d > runs/UBER/company_context.json
          mkdir -p runs/UBER/sources
          echo '' | base64 -d > runs/UBER/sources/README.md
          python harness.py freeze UBER --provider openai --model gpt-5.6-sol --reasoning-effort high
          python harness.py plan UBER
          python harness.py prompt UBER EV --out runs/UBER/EV_prompt.md
          echo '' | base64 -d > runs/UBER/reports/EV.json
          python harness.py validate UBER EV
          python harness.py prompt UBER AS --out runs/UBER/AS_prompt.md
          echo '' | base64 -d > runs/UBER/reports/AS.json
          python harness.py validate UBER AS
          python harness.py prompt UBER DI --out runs/UBER/DI_prompt.md
          echo '' | base64 -d > runs/UBER/reports/DI.json
          python harness.py validate UBER DI
          python harness.py plan UBER
          python harness.py prompt UBER SL --out runs/UBER/SL_prompt.md
          echo '' | base64 -d > runs/UBER/reports/SL.json
          python harness.py validate UBER SL
          python harness.py prompt UBER CP --out runs/UBER/CP_prompt.md
          echo '' | base64 -d > runs/UBER/reports/CP.json
          python harness.py validate UBER CP
          python harness.py prompt UBER MT --out runs/UBER/MT_prompt.md
          echo '' | base64 -d > runs/UBER/reports/MT.json
          python harness.py validate UBER MT
          python harness.py prompt UBER RF --out runs/UBER/RF_prompt.md
          echo '' | base64 -d > runs/UBER/reports/RF.json
          python harness.py validate UBER RF
          python harness.py prompt UBER MA --out runs/UBER/MA_prompt.md
          echo '' | base64 -d > runs/UBER/reports/MA.json
          python harness.py validate UBER MA
          python harness.py prompt UBER FS --out runs/UBER/FS_prompt.md
          echo '' | base64 -d > runs/UBER/reports/FS.json
          python harness.py validate UBER FS
          python harness.py plan UBER
          python harness.py prompt UBER MO --out runs/UBER/MO_prompt.md
          echo '' | base64 -d > runs/UBER/reports/MO.json
          python harness.py validate UBER MO
          python harness.py cache-macro UBER
          python harness.py plan UBER
          python harness.py digest UBER
          python harness.py prompt UBER ED --out runs/UBER/ED_prompt.md
          echo '' | base64 -d > runs/UBER/reports/ED.json
          python harness.py validate UBER ED
          python harness.py prompt UBER RT --out runs/UBER/RT_prompt.md
          echo '' | base64 -d > runs/UBER/reports/RT.json
          python harness.py validate UBER RT
          python harness.py plan UBER
          python harness.py digest UBER
          python harness.py aggregate UBER
          python harness.py prompt UBER IC --out runs/UBER/IC_prompt.md
          echo '' | base64 -d > runs/UBER/reports/IC.json
          python harness.py validate UBER IC
          python harness.py plan UBER
          python harness.py aggregate UBER
          python - <<'PY'
          from pathlib import Path
          import json
          run=Path("runs/UBER")
          agg=json.loads((run/"aggregate.json").read_text(encoding="utf-8"))
          verdict={
            "ticker":"UBER",
            "as_of_date":"2026-09-18",
            "score_100":agg["score_100"],
            "classification":agg["classification"],
            "disruptive_innovation_score":agg["disruptive_innovation_score"],
            "archetype":"compounder",
            "secondary_archetypes":[],
            "archetype_rationale":"Retain Compounder. Formal Compounder domain gates pass. Emerging Outlier fails the price/Base range, Moonshot fails DI>=80, and Expectation Gap is not confirmed because valuation_percentile_5y remains null.",
            "hard_veto_status":agg["hard_veto_status"],
            "ic_state":"NORMAL_CANDIDATE",
            "position_range":"2-4% target; initial 1.5-2%, staged at 0.9x macro pacing; hold at <=2% until M&A leverage and normalized FCF/share are clearer",
            "domain_scores":agg["domain_scores"],
            "disputes":agg["disputes"],
            "falsifiers":[
              "Normalized owner FCF/share fails to grow for two fiscal years while Trips/Gross Bookings continue to expand.",
              "Delivery Hero integration raises leverage without improving consolidated per-share FCF and deleveraging within the planned integration period.",
              "Major AV fleets increasingly bypass Uber or force structurally lower marketplace economics."
            ],
            "macro_pacing_multiplier":0.9
          }
          (run/"final_verdict.json").write_text(json.dumps(verdict,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          echo '' | base64 -d > runs/UBER/one_page_investment_record.md
          python harness.py digest UBER
          echo "===== FINAL AGGREGATE ====="
          cat runs/UBER/aggregate.json
          echo "===== FINAL VERDICT ====="
          cat runs/UBER/final_verdict.json
          echo "===== DIGEST ====="
          cat runs/UBER/digest.md
          echo "===== FINAL AGGREGATE ====="
          cat runs/UBER/aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: UBER-harness-run-2026-09-18-sol-ic
          path: |
            runs/UBER
            runlogs/execution.log
