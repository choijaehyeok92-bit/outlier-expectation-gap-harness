name: AVGO Stage0 EV validation

on:
  push:
    branches:
      - analysis/avgo-2026-09-18-stage0-ev

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Self-test
        run: python harness.py selftest
      - name: Stage 0 intake
        run: python harness.py intake AVGO
      - name: FP prompt generation check
        run: python harness.py prompt AVGO FP > /tmp/AVGO_FP_prompt.md
      - name: Validate financial pack
        run: python harness.py validate-pack AVGO
      - name: Freeze inputs
        run: python harness.py freeze AVGO --provider openai --model gpt-5.6-sol --reasoning-effort high
      - name: Plan
        run: python harness.py plan AVGO
      - name: EV prompt generation check
        run: python harness.py prompt AVGO EV > /tmp/AVGO_EV_prompt.md
      - name: Validate EV
        run: python harness.py validate AVGO EV
      - name: Aggregate
        run: python harness.py aggregate AVGO
      - name: Digest
        run: python harness.py digest AVGO
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/AVGO
          if ! git diff --cached --quiet; then
            git commit -m "analysis(avgo): freeze and validate stage0 EV"
            git push
          fi
