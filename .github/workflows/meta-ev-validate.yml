name: META EV validate aggregate digest 2026-09-18

on:
  push:
    branches:
      - work/meta-2026-09-18-v33
    paths:
      - ".github/workflows/meta-ev-validate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/meta-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate EV and aggregate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/meta-ev-final.log) 2>&1

          python harness.py validate META EV | tee runlogs/validate-ev.txt
          python harness.py aggregate META | tee runlogs/aggregate-after-ev.json
          python harness.py digest META
          python harness.py plan META | tee runlogs/plan-after-ev.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/META runlogs
          if ! git diff --cached --quiet; then
            git commit -m "run: validate and aggregate META EV 2026-09-18"
            git push origin HEAD:work/meta-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: META-ev-validated-2026-09-18
          path: |
            runs/META
            runlogs
