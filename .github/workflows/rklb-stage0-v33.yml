name: RKLB Stage0 v3.3 2026-09-18

on:
  push:
    branches:
      - work/rklb-2026-09-18-v33
    paths:
      - ".github/workflows/rklb-stage0-v33.yml"
      - "harness_core/fetch.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/rklb-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch and prepare RKLB Stage 0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/rklb-stage0.log) 2>&1

          python harness.py selftest
          rm -rf runs/RKLB
          python harness.py init RKLB --as-of 2026-09-18
          python harness.py fetch RKLB --user-agent "RKLB-Stage0 github-actions[bot]@users.noreply.github.com"
          python harness.py intake RKLB | tee runlogs/intake.txt
          python harness.py prompt RKLB FP --out runs/RKLB/FP_prompt.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/RKLB
          if ! git diff --cached --quiet; then
            git commit -m "stage0: fetch RKLB EDGAR sources 2026-09-18"
            git push origin HEAD:work/rklb-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RKLB-stage0-2026-09-18
          path: |
            runs/RKLB
            runlogs
