name: ALAB v3.3 evidence and red team

on:
  push:
    branches:
      - work/alab-2026-09-18-v33
    paths:
      - ".github/workflows/alab-v33-review.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/alab-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Execute ALAB ED and RT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/alab-review.log) 2>&1

          python harness.py selftest
          for AGENT in ED RT; do
            python harness.py prompt ALAB "$AGENT" --out "runs/ALAB/${AGENT}_prompt.md"
            cp ".harness_inputs/ALAB/reports/${AGENT}.json" "runs/ALAB/reports/${AGENT}.json"
            python harness.py validate ALAB "$AGENT"
          done

          python harness.py aggregate ALAB | tee runlogs/aggregate_after_review.json
          python harness.py digest ALAB
          python harness.py plan ALAB | tee runlogs/plan_after_review.txt

          echo "===== NEXT PLAN ====="
          cat runlogs/plan_after_review.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/ALAB
          if ! git diff --cached --quiet; then
            git commit -m "review: complete ALAB ED RT"
            git push origin HEAD:work/alab-2026-09-18-v33
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ALAB-v33-review
          path: |
            runs/ALAB
            runlogs
