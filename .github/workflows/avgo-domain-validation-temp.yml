name: AVGO domain validation

on:
  push:
    branches:
      - analysis/avgo-2026-09-18-stage0-ev

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Prompt checks
        run: |
          python harness.py prompt AVGO SL > /tmp/SL.md
          python harness.py prompt AVGO CP > /tmp/CP.md
          python harness.py prompt AVGO MT > /tmp/MT.md
          python harness.py prompt AVGO RF > /tmp/RF.md
          python harness.py prompt AVGO MA > /tmp/MA.md
      - name: Validate domains
        run: |
          python harness.py validate AVGO SL
          python harness.py validate AVGO CP
          python harness.py validate AVGO MT
          python harness.py validate AVGO RF
          python harness.py validate AVGO MA
      - name: Refresh aggregate and planner
        run: |
          python harness.py aggregate AVGO
          python harness.py digest AVGO
          python harness.py plan AVGO > runs/AVGO/plan_after_domains.txt
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/AVGO
          if ! git diff --cached --quiet; then
            git commit -m "analysis(avgo): validate core domains and refresh plan"
            git push
          fi
