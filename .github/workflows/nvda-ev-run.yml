name: NVDA EV harness run 2026-09-18

on:
  push:
    branches:
      - run/nvda-2026-09-18-sol-ev

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/execution.log) 2>&1

          python harness.py selftest
          python harness.py init NVDA --as-of 2026-09-18
          echo '' | base64 -d > runs/NVDA/company_context.json
          mkdir -p runs/NVDA/sources
          echo '' | base64 -d > runs/NVDA/sources/README.md
          python harness.py freeze NVDA --provider openai --model gpt-5.6-sol --reasoning-effort high
          python harness.py plan NVDA
          python harness.py prompt NVDA EV --out runs/NVDA/EV_prompt.md
          echo '' | base64 -d > runs/NVDA/reports/EV.json
          python harness.py validate NVDA EV
          python harness.py digest NVDA
          python harness.py aggregate NVDA
          echo "===== aggregate.json ====="
          cat runs/NVDA/aggregate.json
          echo "===== digest.md ====="
          cat runs/NVDA/digest.md

      - uses: actions/upload-artifact@v4
        with:
          name: NVDA-harness-run-2026-09-18-sol-ev
          path: |
            runs/NVDA
            runlogs/execution.log
