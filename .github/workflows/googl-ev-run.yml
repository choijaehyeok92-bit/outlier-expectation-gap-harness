name: GOOGL triage run 2026-09-18

on:
  push:
    branches:
      - run/googl-2026-09-18-sol-ev

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute GOOGL EV harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/execution.log) 2>&1
          python harness.py selftest
          python harness.py init GOOGL --as-of 2026-09-18
          echo '' | base64 -d > runs/GOOGL/company_context.json
          mkdir -p runs/GOOGL/sources
          echo '' | base64 -d > runs/GOOGL/sources/README.md
          python harness.py freeze GOOGL --provider openai --model gpt-5.6-sol --reasoning-effort high
          python harness.py plan GOOGL
          python harness.py prompt GOOGL EV --out runs/GOOGL/EV_prompt.md
          echo '' | base64 -d > runs/GOOGL/reports/EV.json
          python harness.py validate GOOGL EV
          python harness.py prompt GOOGL AS --out runs/GOOGL/AS_prompt.md
          echo '' | base64 -d > runs/GOOGL/reports/AS.json
          python harness.py validate GOOGL AS
          python harness.py prompt GOOGL DI --out runs/GOOGL/DI_prompt.md
          echo '' | base64 -d > runs/GOOGL/reports/DI.json
          python harness.py validate GOOGL DI
          python harness.py plan GOOGL
          python harness.py digest GOOGL
          python harness.py aggregate GOOGL
          echo "===== FINAL AGGREGATE ====="
          cat runs/GOOGL/aggregate.json
      - uses: actions/upload-artifact@v4
        with:
          name: GOOGL-harness-run-2026-09-18-sol-triage
          path: |
            runs/GOOGL
            runlogs/execution.log
