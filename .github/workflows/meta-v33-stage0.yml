name: META Stage0 v3.3 2026-09-18

on:
  push:
    branches:
      - work/meta-2026-09-18-v33
    paths:
      - ".github/workflows/meta-v33-stage0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/meta-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch and prepare META Stage 0
        shell: bash
        run: |
          set -u -o pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/meta-stage0.log) 2>&1

          python harness.py selftest
          rm -rf runs/META
          python harness.py init META --as-of 2026-09-18

          set +e
          python harness.py fetch META --user-agent "META-Stage0 github-actions[bot]@users.noreply.github.com"
          FETCH_RC=$?
          set -e
          echo "fetch_exit_code=$FETCH_RC" | tee runlogs/fetch_status.txt

          python harness.py intake META | tee runlogs/intake.txt
          python harness.py prompt META FP --out runs/META/FP_prompt.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/META runlogs
          if ! git diff --cached --quiet; then
            git commit -m "stage0: prepare META intake 2026-09-18"
            git push origin HEAD:work/meta-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: META-stage0-2026-09-18
          path: |
            runs/META
            runlogs
