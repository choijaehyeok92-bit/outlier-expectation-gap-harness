name: META Stage0 + EV prompt v3.3 2026-09-18

on:
  push:
    branches:
      - work/meta-2026-09-18-v33
    paths:
      - ".github/workflows/meta-v33-stage0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/meta-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate META Stage 0 and prepare EV prompt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/meta-stage0.log) 2>&1

          python harness.py selftest
          rm -rf runs/META
          python harness.py init META --as-of 2026-09-18

          mkdir -p runs/META/sources/financials
          cp .harness_inputs/META-2026-09-18/normalized_financials.json runs/META/sources/financials/normalized_financials.json
          cp .harness_inputs/META-2026-09-18/source_manifest.json runs/META/sources/source_manifest.json
          cp .harness_inputs/META-2026-09-18/company_context.json runs/META/company_context.json

          python harness.py intake META | tee runlogs/intake.txt
          python harness.py prompt META FP --out runs/META/FP_prompt.md
          python harness.py validate-pack META | tee runlogs/validate_pack.txt

          python harness.py freeze META --provider openai --model gpt-5.6-sol --reasoning-effort high
          python harness.py plan META | tee runlogs/plan.txt
          python harness.py prompt META EV --out runs/META/EV_prompt.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/META runlogs
          if ! git diff --cached --quiet; then
            git commit -m "stage0: validate META and prepare EV prompt 2026-09-18"
            git push origin HEAD:work/meta-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: META-stage0-ev-prompt-2026-09-18
          path: |
            runs/META
            runlogs
