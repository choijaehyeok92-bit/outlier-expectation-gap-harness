name: Provider calibration selftest

on:
  push:
    branches:
      - fix/provider-invariant-scoring
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python harness.py selftest
