name: NVDA v3.1 complete pre-IC

on:
  push:
    branches:
      - analysis/nvda-v31-complete-20260919

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/nvda-v31-complete-20260919
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate ED RT MO and advance plan
        shell: bash
        run: |
          set -euo pipefail
          python harness.py selftest
          python harness.py validate NVDA-V31-2026-09-19 ED RT MO
          python harness.py aggregate NVDA-V31-2026-09-19
          python harness.py digest NVDA-V31-2026-09-19
          python harness.py plan NVDA-V31-2026-09-19 | tee runs/NVDA-V31-2026-09-19/plan_pre_ic.txt
          python harness.py report NVDA-V31-2026-09-19
      - name: Commit validated pre-IC outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/NVDA-V31-2026-09-19
          git commit -m "analysis(nvda): validate v3.1 pre-IC gates" || exit 0
          git push
