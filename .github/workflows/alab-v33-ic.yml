name: ALAB v3.3 investment committee

on:
  push:
    branches:
      - work/alab-2026-09-18-v33
    paths:
      - ".github/workflows/alab-v33-ic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/alab-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Execute ALAB IC and finalize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/alab-ic.log) 2>&1

          python harness.py selftest
          python harness.py prompt ALAB IC --out runs/ALAB/IC_prompt.md
          cp ".harness_inputs/ALAB/reports/IC.json" "runs/ALAB/reports/IC.json"
          python harness.py validate ALAB IC

          python harness.py validate ALAB
          python harness.py aggregate ALAB | tee runlogs/aggregate_final.json
          python harness.py digest ALAB
          python harness.py plan ALAB | tee runlogs/plan_final.txt
          python harness.py report ALAB

          echo "===== FINAL PLAN ====="
          cat runlogs/plan_final.txt
          echo "===== FINAL VERDICT ====="
          cat runs/ALAB/final_verdict.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/ALAB
          if ! git diff --cached --quiet; then
            git commit -m "ic: finalize ALAB 2026-09-18"
            git push origin HEAD:work/alab-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ALAB-v33-final
          path: |
            runs/ALAB
            runlogs
