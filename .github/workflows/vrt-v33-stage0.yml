name: VRT v3.3 stage0 fetch

on:
  push:
    branches:
      - work/vrt-2026-09-18-v33
    paths:
      - ".github/workflows/vrt-v33-stage0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/vrt-2026-09-18-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch and persist VRT Stage 0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/vrt-stage0.log) 2>&1

          python harness.py selftest
          if [ ! -d runs/VRT ]; then
            python harness.py init VRT --as-of 2026-09-18
          fi
          python harness.py fetch VRT --user-agent "choijaehyeok92@gmail.com"

          set +e
          python harness.py intake VRT | tee runlogs/intake_before_fp.txt
          echo "INTAKE_RC=$?" | tee -a runlogs/intake_before_fp.txt
          python harness.py prompt VRT FP --out runs/VRT/FP_prompt.md
          echo "FP_PROMPT_RC=$?" | tee -a runlogs/intake_before_fp.txt
          python harness.py validate-pack VRT | tee runlogs/validate_pack_before_fp.txt
          echo "VALIDATE_PACK_RC=$?" | tee -a runlogs/validate_pack_before_fp.txt
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/VRT
          if ! git diff --cached --quiet; then
            git commit -m "stage0: fetch VRT as of 2026-09-18"
            git push origin HEAD:work/vrt-2026-09-18-v33
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VRT-v33-stage0
          path: |
            runs/VRT
            runlogs
