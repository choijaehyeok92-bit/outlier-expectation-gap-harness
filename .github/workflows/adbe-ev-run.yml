name: ADBE IC run 2026-09-18

on:
  push:
    branches:
      - run/adbe-2026-09-18-sol-ev

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute ADBE IC harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          exec > >(tee runlogs/execution.log) 2>&1
          python harness.py selftest
          python harness.py init ADBE --as-of 2026-09-18
          echo '' | base64 -d > runs/ADBE/company_context.json
          mkdir -p runs/ADBE/sources
          echo '' | base64 -d > runs/ADBE/sources/README.md
          echo '' | base64 -d > runs/ADBE/sources/valuation_percentiles_5y.json
          python harness.py freeze ADBE --provider openai --model gpt-5.6-sol --reasoning-effort high
          python harness.py plan ADBE
          python harness.py prompt ADBE EV --out runs/ADBE/EV_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/EV.json
          python harness.py validate ADBE EV
          python harness.py prompt ADBE AS --out runs/ADBE/AS_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/AS.json
          python harness.py validate ADBE AS
          python harness.py prompt ADBE DI --out runs/ADBE/DI_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/DI.json
          python harness.py validate ADBE DI
          python harness.py plan ADBE
          python harness.py prompt ADBE SL --out runs/ADBE/SL_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/SL.json
          python harness.py validate ADBE SL
          python harness.py prompt ADBE CP --out runs/ADBE/CP_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/CP.json
          python harness.py validate ADBE CP
          python harness.py prompt ADBE MT --out runs/ADBE/MT_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/MT.json
          python harness.py validate ADBE MT
          python harness.py prompt ADBE RF --out runs/ADBE/RF_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/RF.json
          python harness.py validate ADBE RF
          python harness.py prompt ADBE MA --out runs/ADBE/MA_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/MA.json
          python harness.py validate ADBE MA
          python harness.py prompt ADBE FS --out runs/ADBE/FS_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/FS.json
          python harness.py validate ADBE FS
          python harness.py plan ADBE
          python harness.py prompt ADBE MO --out runs/ADBE/MO_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/MO.json
          python harness.py validate ADBE MO
          python harness.py cache-macro ADBE
          python harness.py plan ADBE
          python harness.py digest ADBE
          python harness.py prompt ADBE ED --out runs/ADBE/ED_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/ED.json
          python harness.py validate ADBE ED
          python harness.py prompt ADBE RT --out runs/ADBE/RT_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/RT.json
          python harness.py validate ADBE RT
          python harness.py plan ADBE
          python harness.py digest ADBE
          python harness.py aggregate ADBE
          python harness.py prompt ADBE IC --out runs/ADBE/IC_prompt.md
          echo '' | base64 -d > runs/ADBE/reports/IC.json
          python harness.py validate ADBE IC
          python harness.py plan ADBE
          python harness.py aggregate ADBE
          python - <<'PY'
          from pathlib import Path
          import json
          run=Path("runs/ADBE")
          agg=json.loads((run/"aggregate.json").read_text(encoding="utf-8"))
          verdict={
            "ticker":"ADBE",
            "as_of_date":"2026-09-18",
            "score_100":agg["score_100"],
            "classification":agg["classification"],
            "disruptive_innovation_score":agg["disruptive_innovation_score"],
            "archetype":"compounder",
            "secondary_archetypes":["expectation_gap"],
            "archetype_rationale":"Retain Compounder as primary because MT/RF/MA/FS/EV all pass the formal gate and recurring economics remain strong. Expectation Gap is secondary because valuation_percentile_5y=0.00, price/Base=0.6098, EV=87.5 and FS=81.75 satisfy the formal conditions. Moonshot fails DI>=80; Emerging Outlier fails the 0.8-1.2 price/Base range.",
            "hard_veto_status":agg["hard_veto_status"],
            "ic_state":"NORMAL_CANDIDATE",
            "position_range":"2-4% target; initial ~2%, staged at 0.9x macro pacing; expansion toward the upper half requires stable pricing/retention and normalized FCF/share evidence",
            "domain_scores":agg["domain_scores"],
            "disputes":agg["disputes"],
            "falsifiers":[
              "Normalized owner FCF/share remains below roughly $20 for multiple years while recurring revenue continues to grow.",
              "Creative/Acrobat pricing or retention weakens structurally as AI-native tools gain primary professional workflow share.",
              "AI-first ARR growth remains rapid but fails to support consolidated ARR, margins and FCF/share through the CEO transition."
            ],
            "macro_pacing_multiplier":0.9
          }
          (run/"final_verdict.json").write_text(json.dumps(verdict,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          echo '' | base64 -d > runs/ADBE/one_page_investment_record.md
          python harness.py digest ADBE
          echo "===== FINAL AGGREGATE ====="
          cat runs/ADBE/aggregate.json
          echo "===== FINAL VERDICT ====="
          cat runs/ADBE/final_verdict.json
          echo "===== DIGEST ====="
          cat runs/ADBE/digest.md
      - uses: actions/upload-artifact@v4
        with:
          name: ADBE-harness-run-2026-09-18-sol-ic
          path: |
            runs/ADBE
            runlogs/execution.log
