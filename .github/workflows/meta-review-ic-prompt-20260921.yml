name: META review IC prompt 2026-09-21

on:
  push:
    branches:
      - work/meta-2026-09-21-v33
    paths:
      - ".github/workflows/meta-review-ic-prompt-20260921.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/meta-2026-09-21-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Emit IC prompt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          python harness.py aggregate META_REVIEW_20260921 > runlogs/meta-review-aggregate-pre-ic.json
          python harness.py digest META_REVIEW_20260921
          python harness.py prompt META_REVIEW_20260921 IC --out runs/META_REVIEW_20260921/IC_prompt.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/META_REVIEW_20260921 runlogs
          if ! git diff --cached --quiet; then
            git commit -m "review: emit META IC prompt 2026-09-21"
            git push origin HEAD:work/meta-2026-09-21-v33
          fi
