name: META review-only fork 2026-09-21

on:
  push:
    branches:
      - work/meta-2026-09-21-v33
    paths:
      - ".github/workflows/meta-review-fork-20260921.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/meta-2026-09-21-v33
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Fork META into review-only run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runlogs
          rm -rf runs/META_REVIEW_20260921
          python harness.py fork-run META META_REVIEW_20260921 --carry-domain-reports
          python harness.py validate-pack META_REVIEW_20260921
          python harness.py freeze META_REVIEW_20260921 --provider openai --model gpt-6-astra --review-only
          python harness.py aggregate META_REVIEW_20260921 > runlogs/meta-review-aggregate-initial.json
          python harness.py digest META_REVIEW_20260921
          python harness.py plan META_REVIEW_20260921 | tee runlogs/meta-review-plan-initial.txt
          python harness.py prompt META_REVIEW_20260921 ED --out runs/META_REVIEW_20260921/ED_prompt.md
          python harness.py prompt META_REVIEW_20260921 RT --out runs/META_REVIEW_20260921/RT_prompt.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/META_REVIEW_20260921 runlogs
          if ! git diff --cached --quiet; then
            git commit -m "review: fork META 2026-09-21 for ED RT IC"
            git push origin HEAD:work/meta-2026-09-21-v33
          fi
