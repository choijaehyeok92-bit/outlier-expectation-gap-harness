# Alembic configuration.
#
# The URL is intentionally absent: env.py reads HARNESS_DATABASE_URL, so a
# migration can never be applied to a database nobody named.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
